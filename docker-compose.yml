services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rezka-backend:latest
    container_name: rezka-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "9970:9970"
    volumes:
      - /storage/files/Media:/storage/files/Media
      - ./data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: rezka-bot:latest
    container_name: rezka-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
